name: Build MONEY MIND APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract MONEY MIND project
        run: |
          unzip -q *.zip
          cd MONEY_MIND_NATIVE_READY
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MONEY-MIND-APK
          path: MONEY_MIND_NATIVE_READY/app/build/outputs/apk/debug/app-debug.apk
